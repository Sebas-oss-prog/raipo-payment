<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата — Слободское РайПО</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 15px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 420px;
            margin: 0 auto;
        }
        h2 { color: #2e7d32; text-align: center; }
        .amount { 
            font-size: 28px; 
            font-weight: bold; 
            text-align: center; 
            color: #1b5e20; 
            margin: 15px 0;
        }
        .check {
            background: #f9f9f9;
            border: 2px dashed #2e7d32;
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
            font-size: 15px;
            line-height: 1.6;
        }
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 17px;
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
        }
        .sbp  { background: #4caf50; }
        .card { background: #2196f3; }
        .cash { background: #ff9800; }
        .close { background: #666; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container" id="payment-screen">
        <h2>💰 Оплата заказа</h2>
        <p class="amount" id="amount">Сумма: 0 ₽</p>
        
        <button class="sbp" onclick="choosePayment('sbp')">Оплатить через СБП (QR)</button>
        <button class="card" onclick="choosePayment('card')">Оплатить банковской картой</button>
        <button class="cash" onclick="choosePayment('cash')">Наличными при получении</button>
    </div>

    <!-- Экран чека (скрыт изначально) -->
    <div class="container" id="check-screen" style="display: none;">
        <h2>✅ Чек оплаты</h2>
        <div class="check" id="check-content">
            <!-- Чек будет вставлен через JavaScript -->
        </div>
        <button onclick="sendCheckToBot()">Отправить чек в бот</button>
        <button class="close" onclick="closeApp()">Закрыть</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('order_id') || 'TMP-' + Date.now();
        const amount = parseFloat(params.get('amount')) || 0;
        let selectedMethod = '';

        document.getElementById('amount').textContent = `Сумма к оплате: ${amount} ₽`;

        function choosePayment(method) {
            selectedMethod = method;
            tg.showPopup({
                title: "Подтверждение оплаты",
                message: `Оплатить ${amount} ₽ через ${method.toUpperCase()}?`,
                buttons: [
                    {id: "cancel", type: "cancel"},
                    {id: "ok", type: "ok"}
                ]
            }, function(buttonId) {
                if (buttonId === "ok") {
                    showCheck();
                }
            });
        }

        function showCheck() {
            const now = new Date();
            const dateStr = now.toLocaleString('ru-RU', { 
                day: '2-digit', 
                month: '2-digit', 
                year: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit' 
            });

            const methodNames = {
                'sbp': 'СБП (QR-код)',
                'card': 'Банковская карта',
                'cash': 'Наличными при получении'
            };

            const checkHTML = `
                <strong>Слободское РайПО</strong><br>
                Чек № ${orderId}<br>
                Дата: ${dateStr}<br><br>
                Товар: ${params.get('product_name') || 'Товар из бота'}<br>
                Количество: ${params.get('quantity') || '1'}<br>
                Сумма: ${amount} ₽<br>
                Способ оплаты: ${methodNames[selectedMethod] || selectedMethod}<br><br>
                <strong>Оплачено успешно ✓</strong>
            `;

            document.getElementById('check-content').innerHTML = checkHTML;
            document.getElementById('payment-screen').style.display = 'none';
            document.getElementById('check-screen').style.display = 'block';
        }

        function sendCheckToBot() {
            const dataToSend = {
                order_id: orderId,
                payment_method: selectedMethod,
                amount: amount,
                status: "success",
                timestamp: Date.now()
            };
            tg.sendData(JSON.stringify(dataToSend));
            tg.close();
        }

        function closeApp() {
            tg.close();
        }
    </script>
</body>
</html>
