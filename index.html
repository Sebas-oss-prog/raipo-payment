<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата — Слободское РайПО</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 15px; }
        .container { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { color: #2e7d32; text-align: center; }
        .check { background: #f9f9f9; border: 2px dashed #2e7d32; border-radius: 12px; padding: 15px; margin: 15px 0; line-height: 1.6; }
        button { width: 100%; padding: 15px; margin: 10px 0; font-size: 17px; border: none; border-radius: 12px; color: white; cursor: pointer; }
        .send { background: #4caf50; }
        .close { background: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h2>✅ Чек оплаты</h2>
        <div class="check" id="check-content"></div>
        
        <button class="send" onclick="sendCheckToBot()">📤 Отправить чек в бот</button>
        <button class="close" onclick="closeApp()">❌ Закрыть</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        const amount = parseFloat(params.get('amount')) || 0;
        const orderId = params.get('order_id') || 'TMP-' + Date.now();

        // Показ чека
        function showCheck() {
            const now = new Date();
            const dateStr = now.toLocaleString('ru-RU');

            const checkHTML = `
                <strong>Слободское РайПО</strong><br>
                Чек № ${orderId}<br>
                Дата: ${dateStr}<br><br>
                Сумма к оплате: <strong>${amount} ₽</strong><br><br>
                <strong>Оплачено успешно ✓</strong>
            `;
            document.getElementById('check-content').innerHTML = checkHTML;
        }

        showCheck();

        function sendCheckToBot() {
            tg.MainButton.setText("Отправляем чек...");
            tg.MainButton.show();

            const data = {
                status: "success",
                amount: amount,
                order_id: orderId,
                payment_method: "mini_app",
                timestamp: Date.now()
            };

            tg.sendData(JSON.stringify(data));
            tg.close();
        }

        function closeApp() {
            tg.close();
        }
    </script>
</body>
</html>
