<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата — Слободское РайПО</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 420px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 { color: #2e7d32; }
        .amount { font-size: 24px; font-weight: bold; margin: 20px 0; }
        button {
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
        }
        .sbp  { background: #4caf50; }
        .card { background: #2196f3; }
        .cash { background: #ff9800; }
        .back { margin-top: 30px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h2>💰 Оплата заказа</h2>
        <p class="amount" id="amount">Сумма: 0 ₽</p>

        <button class="sbp" onclick="choosePayment('sbp')">Оплатить через СБП (QR-код)</button>
        <button class="card" onclick="choosePayment('card')">Оплатить банковской картой</button>
        <button class="cash" onclick="choosePayment('cash')">Наличными при получении</button>

        <p class="back">Слободское РайПО • Безопасная оплата</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Получаем параметры из URL (order_id и сумма)
        const params = new URLSearchParams(window.location.search);
        const orderId = params.get('order_id');
        const amount = parseFloat(params.get('amount')) || 0;

        document.getElementById('amount').textContent = `Сумма к оплате: ${amount} ₽`;

        function choosePayment(method) {
            tg.showPopup({
                title: "Подтверждение оплаты",
                message: `Вы выбрали оплату через ${method.toUpperCase()}. Продолжить?`,
                buttons: [
                    {id: "cancel", type: "cancel"},
                    {id: "ok", type: "ok"}
                ]
            }, function(buttonId) {
                if (buttonId === "ok") {
                    // Имитируем обработку платежа
                    tg.MainButton.text = "Обрабатываем...";
                    tg.MainButton.show();

                    setTimeout(() => {
                        const paymentData = {
                            order_id: orderId,
                            payment_method: method,
                            status: "success",
                            amount: amount,
                            timestamp: Date.now()
                        };

                        tg.sendData(JSON.stringify(paymentData));  // Отправляем данные в бот
                        tg.close();  // Закрываем Mini App
                    }, 1200);
                }
            });
        }
    </script>
</body>
</html>
